version: 1.4.1
repository: https://github.com/fzyzcjy/flutter_interactive

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  analyzer: ^11.0.0
  args: ^2.7.0
  cli_repl: ^0.2.3
  collection: ^1.19.1
  logging: ^1.3.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  vm_service: ^15.1.0

dev_dependencies:
  lint: ">=1.10.0 <3.0.0"
  test: ^1.21.6

executables:
  interactive:
